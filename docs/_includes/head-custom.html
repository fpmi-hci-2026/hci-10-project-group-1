<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });

  document.addEventListener('DOMContentLoaded', () => {
    // kramdown + rouge вешает класс на внешний div, без rouge — на сам <code>
    const blocks = document.querySelectorAll(
      'div.language-mermaid, pre > code.language-mermaid, code.language-mermaid'
    );
    blocks.forEach((el) => {
      const isWrapper = el.matches('div.language-mermaid');
      const source = isWrapper ? (el.querySelector('code') || el) : el;
      const host = document.createElement('div');
      host.className = 'mermaid';
      host.textContent = source.textContent;
      const target = isWrapper ? el : (el.closest('pre') || el);
      target.replaceWith(host);
    });
    mermaid.run({ querySelector: '.mermaid' });
  });
</script>
