title: МаркетШоп.by
description: >-
  Маркетплейс одежды и обуви с автоматической генерацией описаний товаров.
  Учебный проект по курсу «Проектирование человеко-машинных интерфейсов», БГУ ФПМИ.
lang: ru

theme: jekyll-theme-cayman

show_downloads: false

exclude:
  - README.md
  - REPO-SETUP.md
  - lab3/build-pdf.mjs
  - Gemfile
  - Gemfile.lock
  - vendor

include:
  - lab3/diagrams/img

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

relative_links:
  enabled: true
  collections: false

repository_url: https://github.com/fpmi-hci-2026/hci-10-project-group-1
footer: БГУ ФПМИ, курс «Проектирование человеко-машинных интерфейсов», группа 10, команда 1, 2026

# Меню сайта повторяет структуру страниц вики (ЛР№1, п. 8.2)
nav:
  - { title: О проекте, url: / }
  - { title: Требования, url: /requirements.html }
  - { title: Пользовательские истории, url: /user-stories.html }
  - { title: Доп. спецификация, url: /specification.html }
  - { title: База данных, url: /database.html }
  - { title: API, url: /api.html }
  - { title: Структура файлов, url: /files.html }
  - { title: Дизайн, url: /design.html }
  - { title: Презентация, url: /presentation.html }
  - { title: Отчёты, url: /reports.html }

defaults:
  - scope: { path: "" }
    values: { layout: default }
