<!doctype html><html lang="ru"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Карточная сортировка — экран с номерами</title>
<style>
body{margin:0;font:16px Inter,system-ui,sans-serif;background:#ddd}
.bar{padding:10px 16px;background:#3E3228;color:#fff;display:flex;gap:16px;align-items:center}
.bar a{color:#F7E6DF}
.stage{position:relative;margin:16px auto;background:#fff;box-shadow:0 2px 12px rgb(0 0 0/.2)}
iframe{border:0;display:block}
.n{position:absolute;width:34px;height:34px;border-radius:50%;background:#1f6feb;color:#fff;font:700 18px system-ui;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff;transform:translate(-50%,-50%);pointer-events:none}
.box{position:absolute;border:3px solid #1f6feb;border-radius:8px;pointer-events:none}
</style></head><body>
<div class="bar"><b>Карточная сортировка</b><a href="?p=web">Веб</a><a href="?p=mobile">Мобильное</a><span id="hint"></span></div>
<div class="stage" id="stage"><iframe id="f"></iframe></div>
<script>
// Номера областей совпадают с таблицей 3 отчёта ЛР№6
const P = new URLSearchParams(location.search).get('p') === 'mobile' ? 'mobile' : 'web';
const CFG = {
  web: { src: '../../lab5/mockups/catalog.html', w: 1440, h: 900, areas: [
    [1, '.search'], [2, '.util > div:nth-child(1)'], [3, '.util > a'], [4, '.util > div:nth-child(3)'],
    [5, '.nav .g:nth-of-type(1)'], [6, '.nav .g:nth-of-type(2)'], [7, '.nav .bel'], [8, '.side'],
    [9, '.sort'], [10, '.grid .card:nth-child(4)']] },
  mobile: { src: '../../lab5/mockups/prototype-home.html', w: 390, h: 844, areas: [
    [1, '.msearch'], [2, '.cats'], [3, '.mgrid .card:nth-child(1)'],
    [4, '.bn a:nth-child(1)'], [5, '.bn a:nth-child(2)'], [6, '.bn a:nth-child(3)'], [7, '.bn a:nth-child(4)'], [8, '.bn a:nth-child(5)']] },
}[P];
document.getElementById('hint').textContent = P === 'web' ? 'Экран: каталог, 1440 px' : 'Экран: лента, 390 px';
const f = document.getElementById('f'), stage = document.getElementById('stage');
f.width = CFG.w; f.height = CFG.h; stage.style.width = CFG.w + 'px';
f.src = CFG.src;
stage.style.zoom = Math.min(1, (innerWidth - 32) / CFG.w);
f.onload = () => {
  const d = f.contentDocument;
  d.querySelectorAll('a').forEach(a => a.addEventListener('click', e => e.preventDefault()));
  for (const [n, sel] of CFG.areas) {
    const el = d.querySelector(sel); if (!el) continue;
    const r = el.getBoundingClientRect();
    const box = document.createElement('div'); box.className = 'box';
    Object.assign(box.style, { left: r.left - 3 + 'px', top: r.top - 3 + 'px', width: r.width + 6 + 'px', height: Math.min(r.height, CFG.h - r.top - 6) + 6 + 'px' });
    const b = document.createElement('div'); b.className = 'n'; b.textContent = n;
    Object.assign(b.style, { left: r.left - 12 + 'px', top: r.top - 8 + 'px' });
    stage.append(box, b);
  }
};
</script></body></html>
